---
# Tiers hold packages with identical names across distros; per-OS names, AUR
# packages and custom installers live in hieradata/os/<family>.yaml and are
# array-merged onto these.
lookup_options:
  "^(core_tools|dev_tools|infra_tools|security_tools|net_tools|media_tools|desktop_apps|window_manager|fonts)$":
    merge: unique

aur_helper: 'yay'
aur_user: 'aur'

users:
    - name: yassine
      ensure: present
      admin: true
      shell: /usr/bin/bash
      dotfiles: "https://github.com/Sandlayth/dotfiles"
    - name: sandlayth
      ensure: present
      admin: true
      shell: /usr/bin/bash
      dotfiles: "https://github.com/Sandlayth/dotfiles"

core_tools:
    - name: 'bash'
    - name: 'bash-completion'
    - name: 'curl'
    - name: 'git'
    - name: 'gnupg'
    - name: 'vim'
    - name: 'nano'
    - name: 'tmux'
    - name: 'tree'
    - name: 'zip'
    - name: '7zip'
    - name: 'dos2unix'
    - name: 'colordiff'
    - name: 'aria2'
    - name: 'rsync'
    - name: 'ripgrep'
    - name: 'bat'
    - name: 'htop'
    - name: 'jq'
    - name: 'yq'
    - name: 'parallel'
    - name: 'pwgen'
    - name: 'progress'
    - name: 'bc'
    - name: 'mosh'
    - name: 'btrfs-progs'
    - name: 'fscrypt'

dev_tools:
    - name: 'cmake'
    - name: 'make'
    - name: 'gcc'
    - name: 'graphviz'
    - name: 'mise'
    - name: 'pyenv'
    - name: 'uv'
    - name: 'pnpm'
    - name: 'just'
    - name: 'ansible-lint'
    - name: 'android-tools'
    - name: 'android-file-transfer'

infra_tools:
