    - name: 'i3blocks'
    - name: 'i3status'
    - name: 'inkscape'
    - name: 'keybase' # archlinux
      onlyif: 'test -f /etc/arch-release'
      path: [ '/bin', '/usr/bin', '/usr/local/bin' ]
      command: 'yes | yay -S --needed keybase'
    - name: 'iproute2'
