---
users:
    - name: sandlayth
      ensure: present
      admin: true
      shell: /usr/bin/bash
      dotfiles: "https://github.com/Sandlayth/dotfiles"

base_packages:
    - name: 'aria2'
    - name: 'bash'
    - name: 'build-essential'
    - name: 'cmake'
    - name: 'colordiff'
    - name: 'curl'
    - name: 'dos2unix'
    - name: 'docker'
      path: [ '/bin', '/usr/bin', '/usr/local/bin' ]
      command: 'curl -sSL https://get.docker.com/ | sh'
      onlyif: 'test -f /usr/bin/curl'
      unless: 'test -f /usr/bin/docker'
      service:
          ensure: 'running'
          enable: 'true'
    - name: 'docker-compose'
    - name: 'docker scout'
      path: [ '/bin', '/usr/bin', '/usr/local/bin' ]
      command: 'curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh'
      onlyif: 'test -f /usr/bin/curl'
      onlyif: 'test -f /etc/debian_version'
      onlyif: 'test -f /usr/bin/docker'
    - name: 'docker-scout'
      onlyif: 'test -f /etc/arch-release'
      path: [ '/bin', '/usr/bin', '/usr/local/bin' ]
      command: 'yes | yay -S --needed docker-scout'
    - name: 'gcc'
    - name: 'git'
    - name: 'glow' # archlinux
    - name: 'gnupg'
    - name: 'hadolint-debian'
      path: [ '/bin', '/usr/bin', '/usr/local/bin' ]
      command: 'curl -L https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint && chmod 755 /usr/local/bin/hadolint'
      onlyif: 'test -f /usr/bin/curl'
      onlyif: 'test -f /etc/debian_version'
      unless: 'test -f /usr/local/bin/hadolint'
    - name: 'hadolint'
      onlyif: 'test -f /etc/arch-release'
      path: [ '/bin', '/usr/bin', '/usr/local/bin' ]
      command: 'yes | yay -S --needed hadolint'
    - name: 'iproute2'
    - name: 'iptables'
    - name: 'jq'
    - name: 'make'
    - name: 'mosh'
    - name: 'ntp'
    - name: 'parted'
    - name: 'progress'
    - name: 'python3'
    - name: 'python3-dev'
    - name: 'rsync'
    - name: 'ripgrep'
    - name: 'snapd'
    - name: 'slim'
      onlyif: 'test -f /etc/arch-release'
      path: [ '/bin', '/usr/bin', '/usr/local/bin' ]
      command: 'yes | yay -S --needed docker-slim-bin'
    - name: 'slim-debian'
      path: [ '/bin', '/usr/bin', '/usr/local/bin' ]
      command: "curl -sL https://raw.githubusercontent.com/slimtoolkit/slim/master/scripts/install-slim.sh | sed 's$downloads.dockerslim.com/releases/$github.com/slimtoolkit/slim/releases/download/$' | sudo -E bash -"
      onlyif: 'test -f /usr/bin/curl'
      onlyif: 'test -f /etc/debian_version'
      unless: 'test -f /usr/local/bin/slim'
    - name: 'tmux'
    - name: 'tree'
    - name: 'trivy'
    - name: 'vim' # archlinux
    - name: 'vim-nox'
    - name: 'zip'

desktop_packages:
    - name: 'cups'
    - name: 'ffmpeg'
    - name: 'hplip'
    - name: 'imagemagick'
    - name: 'pdftk'
    - name: 'youtube-dl'

graphical_packages:
