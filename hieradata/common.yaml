    - name: 'zathura'
    - name: 'zathura-pdf-mupdf'
    - name: 'xournalpp'
    - name: 'signal-desktop'
    - name: 'kdeconnect'
    - name: 'nautilus'
    - name: 'pcmanfm'
    - name: 'filezilla'
    - name: 'gimp'
