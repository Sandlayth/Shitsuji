    - name: 'kubectl'
    - name: 'kubectx'
    - name: 'kubie'
    - name: 'helm'
    - name: 'minikube'
    - name: 'argocd'
    - name: 'istio'
    - name: 'terraform'
    - name: 'tflint'
    - name: 'rclone'
    - name: 'azure-cli'

security_tools:
