<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    System-wide readable Arabic defaults, per generic family.
    Uses mode="prepend" (not "assign"), and is numbered 45 so it loads BEFORE
    per-user config (/etc/fonts/conf.d/50-user.conf) — meaning each user's
    ~/.config/fontconfig can still override it.
  -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang"><string>ar</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <test name="lang"><string>ar</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang"><string>ar</string></test>
    <edit name="family" mode="prepend"><string>Noto Naskh Arabic</string></edit>
  </match>
</fontconfig>
